version: 2
updates:
  # Cargo (workspace + libs/*)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      koto:
        patterns:
          - "koto*"
      algebraeon:
        patterns:
          - "algebraeon*"
          - "malachite*"
